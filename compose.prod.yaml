name: vovremya

x-app: &app
  image: "vovremya-app:${VOVREMYA_IMAGE_TAG:?Set VOVREMYA_IMAGE_TAG}"
  build:
    context: .
    dockerfile: docker/php/Dockerfile.prod
  env_file:
    - "${VOVREMYA_ENV_FILE:-.env.prod.local}"
  environment:
    APP_ENV: prod
    APP_DEBUG: "0"
  read_only: true
  tmpfs:
    - /app/var:uid=33,gid=33,mode=0770
    - /tmp:uid=33,gid=33,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging: &logging
    driver: local
    options:
      max-size: 10m
      max-file: "3"

services:
  php:
    <<: *app
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "$$s = @fsockopen('127.0.0.1', 9000); exit(false === $$s ? 1 : 0);"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    stop_grace_period: 30s

  migrate:
    <<: *app
    command: ["php", "bin/console", "doctrine:migrations:migrate", "--no-interaction", "--allow-no-migration"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  messenger:
    <<: *app
    command:
      - php
      - bin/console
      - messenger:consume
      - async
      - --time-limit=3600
      - --memory-limit=256M
      - --keepalive=30
      - --no-interaction
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      MESSENGER_CONSUMER_NAME: vovremya_messenger_1
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s

  scheduler:
    <<: *app
    command:
      - php
      - bin/console
      - messenger:consume
      - scheduler_infrastructure
      - scheduler_regular_scheduling
      - scheduler_communications
      - scheduler_waiting
      - --time-limit=3600
      - --memory-limit=128M
      - --no-interaction
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      MESSENGER_CONSUMER_NAME: vovremya_scheduler_1
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s

  caddy:
    image: "vovremya-web:${VOVREMYA_IMAGE_TAG:?Set VOVREMYA_IMAGE_TAG}"
    build:
      context: .
      dockerfile: docker/caddy/Dockerfile.prod
    environment:
      APP_DOMAIN: "${APP_DOMAIN:?Set APP_DOMAIN}"
      ACME_EMAIL: "${ACME_EMAIL:?Set ACME_EMAIL}"
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      php:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vovremya
      POSTGRES_USER: vovremya
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vovremya -d vovremya"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
