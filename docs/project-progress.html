<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Vovremya · Project progress</title>
  <style>
    :root {
      --ink: #152a2b;
      --muted: #5d7070;
      --line: #d8e2df;
      --paper: #f5f8f6;
      --surface: #ffffff;
      --teal: #17665d;
      --teal-soft: #e1f0ec;
      --blue: #2563a8;
      --blue-soft: #e4effb;
      --amber: #a46700;
      --amber-soft: #fff1d3;
      --red: #ad3c3c;
      --red-soft: #fbe5e4;
      --gray-soft: #edf1ef;
      --shadow: 0 5px 18px rgb(21 42 43 / 0.055);
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--paper); }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font: 15px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, select { font: inherit; }
    button, summary { cursor: pointer; }
    a { color: var(--teal); }

    .topbar {
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }
    .topbar-inner, .page {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
    }
    .topbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      min-height: 68px;
    }
    .brand { color: var(--teal); font-size: 20px; font-weight: 750; letter-spacing: -0.02em; }
    .topbar-note { color: var(--muted); font-size: 13px; }
    .page { padding: 38px 0 64px; }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 270px;
      gap: 28px;
      align-items: end;
      margin-bottom: 24px;
    }
    .eyebrow { margin: 0 0 8px; color: var(--teal); font-size: 12px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 7px; font-size: clamp(30px, 5vw, 46px); line-height: 1.08; letter-spacing: -0.04em; }
    .state { margin: 0; color: var(--muted); font-size: 18px; }
    .updated { margin: 15px 0 0; color: var(--muted); font-size: 13px; }
    .hero-stage { border-left: 3px solid var(--teal); padding: 3px 0 3px 16px; }
    .hero-stage-label { color: var(--muted); font-size: 12px; }
    .hero-stage strong { display: block; margin-top: 3px; font-size: 18px; }

    .summary {
      display: grid;
      grid-template-columns: 170px minmax(0, 1fr);
      gap: 26px;
      align-items: center;
      margin-bottom: 30px;
      padding: 21px 24px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .summary-number { font-size: 34px; font-weight: 800; letter-spacing: -0.04em; }
    .summary-number span { color: var(--muted); font-size: 16px; font-weight: 500; letter-spacing: 0; }
    .progress-track { height: 12px; overflow: hidden; border-radius: 99px; background: #e4ebe8; }
    .progress-fill { width: 0; height: 100%; border-radius: inherit; background: var(--teal); transition: width .2s ease; }
    .progress-caption { display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; color: var(--muted); font-size: 13px; }

    .overview-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(280px, .75fr); gap: 20px; margin-bottom: 34px; }
    .panel { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); box-shadow: var(--shadow); }
    .panel-header { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 19px 21px 14px; border-bottom: 1px solid var(--line); }
    .panel-header h2 { margin: 0; font-size: 19px; letter-spacing: -0.02em; }
    .panel-body { padding: 18px 21px 21px; }
    .current-kicker { margin: 0 0 10px; color: var(--teal); font-size: 12px; font-weight: 750; text-transform: uppercase; letter-spacing: .06em; }
    .current-title { margin-bottom: 11px; font-size: 21px; line-height: 1.2; }
    .current-description, .current-outcome { margin-bottom: 12px; color: var(--muted); }
    .current-outcome { margin-bottom: 0; padding-left: 13px; border-left: 2px solid var(--teal); }
    .next-list { display: grid; gap: 0; margin: 0; padding: 0; list-style: none; }
    .next-list li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 9px; padding: 11px 0; border-bottom: 1px solid var(--line); }
    .next-list li:last-child { padding-bottom: 0; border-bottom: 0; }
    .next-number { color: var(--teal); font-weight: 750; }
    .next-title { font-weight: 620; }

    .toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .toolbar h2 { margin: 0; font-size: 25px; letter-spacing: -0.03em; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; }
    .controls label { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
    .controls select, .control-button {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      color: var(--ink);
      padding: 7px 11px;
    }
    .control-button { color: var(--teal); font-weight: 650; }
    .control-button:hover, .controls select:hover { border-color: var(--teal); }
    .control-button:focus-visible, .controls select:focus-visible, summary:focus-visible { outline: 3px solid rgb(23 102 93 / .23); outline-offset: 2px; }
    .plan { display: grid; gap: 10px; }
    .batch { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); box-shadow: var(--shadow); }
    .batch[hidden] { display: none; }
    .batch-summary { display: flex; align-items: center; gap: 13px; padding: 16px 18px; list-style: none; }
    .batch-summary::-webkit-details-marker { display: none; }
    .batch-summary::before { content: '▸'; color: var(--muted); font-size: 17px; transition: transform .15s ease; }
    .batch[open] > .batch-summary::before { transform: rotate(90deg); }
    .batch-heading { min-width: 0; flex: 1; }
    .batch-title { display: block; font-weight: 750; }
    .batch-meta { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; }
    .batch-count { color: var(--muted); font-size: 13px; white-space: nowrap; }
    .part-list { margin: 0; padding: 0 18px 8px; list-style: none; }
    .part {
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr) auto;
      gap: 12px;
      align-items: start;
      padding: 13px 0;
      border-top: 1px solid var(--line);
    }
    .part-number { color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 700; }
    .part-title { margin: 0; font-weight: 680; }
    .part-result, .part-note { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    .part-note { color: var(--amber); }
    .part-date { margin-top: 6px; color: var(--muted); font-size: 12px; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 27px;
      padding: 3px 8px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .status.done { color: var(--teal); background: var(--teal-soft); }
    .status.in_progress { color: var(--blue); background: var(--blue-soft); }
    .status.pending { color: var(--muted); background: var(--gray-soft); }
    .status.blocked { color: var(--red); background: var(--red-soft); }
    .status.review { color: var(--amber); background: var(--amber-soft); }
    .status-symbol { font-size: 14px; line-height: 1; }

    .lower-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 34px; }
    .journal { padding: 0 21px 21px; }
    .journal-entry { padding: 16px 0 14px; border-bottom: 1px solid var(--line); }
    .journal-entry:last-child { border-bottom: 0; padding-bottom: 0; }
    .journal-date { color: var(--teal); font-size: 13px; font-weight: 750; }
    .journal-entry ul { margin: 7px 0 0; padding-left: 19px; }
    .journal-entry li { margin: 4px 0; }
    .decision-title { margin: 0; font-weight: 700; }
    .decision-text { margin: 4px 0 0; color: var(--muted); }
    .empty { margin: 0; color: var(--teal); font-weight: 650; }
    .attention { border-color: #e7c2bf; }
    .attention .panel-header { border-bottom-color: #e7c2bf; }

    @media (max-width: 760px) {
      .topbar-inner, .page { width: min(100% - 24px, 620px); }
      .topbar-inner { min-height: 58px; }
      .topbar-note { display: none; }
      .page { padding-top: 27px; }
      .hero, .overview-grid, .lower-grid { grid-template-columns: 1fr; gap: 16px; }
      .hero { margin-bottom: 20px; }
      .hero-stage { margin-top: 6px; }
      .summary { grid-template-columns: 1fr; gap: 12px; padding: 18px; }
      .panel-header, .panel-body, .journal { padding-left: 17px; padding-right: 17px; }
      .toolbar { align-items: flex-start; }
      .toolbar h2 { width: 100%; }
      .controls { width: 100%; }
      .controls select { flex: 1; min-width: 0; }
      .part { grid-template-columns: 28px minmax(0, 1fr); gap: 9px; }
      .part > .status { grid-column: 2; justify-self: start; }
      .batch-summary { padding: 14px; }
      .part-list { padding-left: 14px; padding-right: 14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">Vovremya · Project progress</div>
      <div class="topbar-note">Актуальное состояние разработки</div>
    </div>
  </header>

  <main class="page">
    <section class="hero" aria-labelledby="project-title">
      <div>
        <p class="eyebrow">Проектный прогресс</p>
        <h1 id="project-title"></h1>
        <p class="state" id="project-state"></p>
        <p class="updated">Последнее обновление: <time id="updated-at"></time></p>
      </div>
      <div class="hero-stage">
        <span class="hero-stage-label">Текущий этап</span>
        <strong id="current-part"></strong>
        <span class="hero-stage-label" id="current-item"></span>
      </div>
    </section>

    <section class="summary" aria-label="Общий прогресс">
      <div class="summary-number"><span id="done-count">0</span> <span>/ <span id="total-count">0</span> частей</span></div>
      <div>
        <div class="progress-track" role="progressbar" aria-label="Общий прогресс" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="progress-caption"><span id="progress-caption"></span><span id="percent"></span></div>
      </div>
    </section>

    <section class="overview-grid">
      <article class="panel" aria-labelledby="now-title">
        <div class="panel-header"><h2 id="now-title">Текущий этап</h2><span id="current-status"></span></div>
        <div class="panel-body" id="current-panel"></div>
      </article>
      <article class="panel" aria-labelledby="next-title">
        <div class="panel-header"><h2 id="next-title">Далее</h2></div>
        <div class="panel-body"><ol class="next-list" id="next-list"></ol></div>
      </article>
    </section>

    <section aria-labelledby="plan-title">
      <div class="toolbar">
        <h2 id="plan-title">Основной план</h2>
        <div class="controls">
          <label>Статус <select id="status-filter" aria-label="Фильтр по статусу"><option value="all">Все</option><option value="done">Выполнено</option><option value="in_progress">В работе</option><option value="pending">Ожидает</option><option value="review">Требует проверки</option><option value="blocked">Заблокировано</option></select></label>
          <label><input id="unfinished-only" type="checkbox"> Только незавершённые</label>
          <button class="control-button" id="current-button" type="button">К текущему этапу</button>
        </div>
      </div>
      <div class="plan" id="plan"></div>
    </section>

    <section class="lower-grid">
      <article class="panel" aria-labelledby="changes-title">
        <div class="panel-header"><h2 id="changes-title">Последние изменения</h2></div>
        <div class="journal" id="changes"></div>
      </article>
      <article class="panel" aria-labelledby="decisions-title">
        <div class="panel-header"><h2 id="decisions-title">Важные решения</h2></div>
        <div class="journal" id="decisions"></div>
      </article>
    </section>

    <section class="panel attention" aria-labelledby="blockers-title" style="margin-top: 20px">
      <div class="panel-header"><h2 id="blockers-title">Блокеры / требует внимания</h2></div>
      <div class="panel-body" id="blockers"></div>
    </section>
  </main>

  <script src="./project-progress-data.js"></script>
  <script>
    (() => {
      const data = window.PROJECT_PROGRESS;
      const symbols = { done: '✅', in_progress: '🔵', pending: '⏳', blocked: '⚠️', review: '🟡' };
      const allParts = data.batches.flatMap((batch) => batch.parts.map((part) => ({ ...part, batch })));
      const currentPart = allParts.find((part) => part.number === data.project.currentPart);
      const byNumber = new Map(allParts.map((part) => [part.number, part]));
      const $ = (id) => document.getElementById(id);
      const text = (id, value) => { $(id).textContent = value; };

      function formatDate(value) {
        return new Intl.DateTimeFormat('ru-RU', { year: 'numeric', month: 'long', day: 'numeric' }).format(new Date(`${value}T12:00:00`));
      }

      function statusBadge(status) {
        const badge = document.createElement('span');
        badge.className = `status ${status}`;
        badge.innerHTML = `<span class="status-symbol">${symbols[status]}</span>${data.statusLabels[status]}`;
        return badge;
      }

      function renderHeader() {
        text('project-title', data.project.name);
        text('project-state', data.project.state);
        text('updated-at', formatDate(data.project.updatedAt));
        $('updated-at').dateTime = data.project.updatedAt;
        text('current-part', `Часть ${data.project.currentPart} · Пачка ${data.project.currentBatch}`);
        text('current-item', data.project.currentItem);
        $('current-status').replaceChildren(statusBadge(currentPart?.status ?? 'pending'));
      }

      function renderSummary() {
        const counts = allParts.reduce((result, part) => {
          result[part.status] += 1;
          return result;
        }, { done: 0, in_progress: 0, pending: 0, blocked: 0, review: 0 });
        const percent = Math.round((counts.done / allParts.length) * 100);
        text('done-count', counts.done);
        text('total-count', allParts.length);
        text('progress-caption', `${counts.done} выполнено · ${counts.in_progress} в работе · ${counts.pending} ожидают`);
        text('percent', `${percent}%`);
        $('progress-fill').style.width = `${percent}%`;
        $('progress-fill').parentElement.setAttribute('aria-valuenow', String(percent));
      }

      function renderCurrent() {
        const root = $('current-panel');
        root.innerHTML = '';
        const kicker = document.createElement('p');
        kicker.className = 'current-kicker';
        kicker.textContent = data.current.title;
        root.append(kicker);
        const title = document.createElement('h3');
        title.className = 'current-title';
        title.textContent = currentPart?.title ?? data.project.currentItem;
        root.append(title);
        const list = document.createElement('ul');
        list.className = 'next-list';
        data.current.items.forEach((item) => {
          const row = document.createElement('li');
          row.textContent = item;
          list.append(row);
        });
        root.append(list);
        const description = document.createElement('p');
        description.className = 'current-description';
        description.textContent = data.current.description;
        root.append(description);
        const outcome = document.createElement('p');
        outcome.className = 'current-outcome';
        outcome.textContent = `Результат: ${data.current.outcome}`;
        root.append(outcome);
      }

      function renderNext() {
        const list = $('next-list');
        list.innerHTML = '';
        data.nextPartNumbers.forEach((number) => {
          const part = byNumber.get(number);
          if (!part) return;
          const row = document.createElement('li');
          const numberNode = document.createElement('span');
          numberNode.className = 'next-number';
          numberNode.textContent = String(part.number).padStart(2, '0');
          const title = document.createElement('span');
          title.className = 'next-title';
          title.textContent = part.title;
          row.append(numberNode, title);
          list.append(row);
        });
      }

      function renderPlan() {
        const plan = $('plan');
        const filter = $('status-filter').value;
        const unfinished = $('unfinished-only').checked;
        plan.innerHTML = '';
        data.batches.forEach((batch) => {
          const visibleParts = batch.parts.filter((part) => (filter === 'all' || part.status === filter) && (!unfinished || part.status !== 'done'));
          const details = document.createElement('details');
          details.className = 'batch';
          details.id = `batch-${batch.number}`;
          details.open = batch.number === data.project.currentBatch;
          if (visibleParts.length === 0) details.hidden = true;
          const summary = document.createElement('summary');
          summary.className = 'batch-summary';
          const heading = document.createElement('span');
          heading.className = 'batch-heading';
          const title = document.createElement('span');
          title.className = 'batch-title';
          title.textContent = `Пачка ${batch.number} · ${batch.title}`;
          const meta = document.createElement('span');
          meta.className = 'batch-meta';
          const done = batch.parts.filter((part) => part.status === 'done').length;
          meta.textContent = `${done} из ${batch.parts.length} частей выполнено`;
          heading.append(title, meta);
          const count = document.createElement('span');
          count.className = 'batch-count';
          count.textContent = `${visibleParts.length} ${visibleParts.length === 1 ? 'часть' : 'части'}`;
          summary.append(heading, count);
          details.append(summary);
          const list = document.createElement('ol');
          list.className = 'part-list';
          visibleParts.forEach((part) => {
            const row = document.createElement('li');
            row.className = 'part';
            const number = document.createElement('span');
            number.className = 'part-number';
            number.textContent = String(part.number).padStart(2, '0');
            const content = document.createElement('div');
            const partTitle = document.createElement('p');
            partTitle.className = 'part-title';
            partTitle.textContent = part.title;
            content.append(partTitle);
            if (part.result) {
              const result = document.createElement('p');
              result.className = 'part-result';
              result.textContent = part.result;
              content.append(result);
            }
            if (part.note) {
              const note = document.createElement('p');
              note.className = 'part-note';
              note.textContent = part.note;
              content.append(note);
            }
            if (part.completedAt) {
              const date = document.createElement('div');
              date.className = 'part-date';
              date.textContent = `Завершено: ${formatDate(part.completedAt)}`;
              content.append(date);
            }
            row.append(number, content, statusBadge(part.status));
            list.append(row);
          });
          details.append(list);
          plan.append(details);
        });
      }

      function renderChanges() {
        const root = $('changes');
        data.changes.forEach((entry) => {
          const article = document.createElement('article');
          article.className = 'journal-entry';
          const date = document.createElement('div');
          date.className = 'journal-date';
          date.textContent = formatDate(entry.date);
          const list = document.createElement('ul');
          entry.items.forEach((item) => {
            const li = document.createElement('li');
            li.textContent = item;
            list.append(li);
          });
          article.append(date, list);
          root.append(article);
        });
      }

      function renderDecisions() {
        const root = $('decisions');
        data.decisions.forEach((entry) => {
          const article = document.createElement('article');
          article.className = 'journal-entry';
          const date = document.createElement('div');
          date.className = 'journal-date';
          date.textContent = formatDate(entry.date);
          const title = document.createElement('p');
          title.className = 'decision-title';
          title.textContent = entry.title;
          const description = document.createElement('p');
          description.className = 'decision-text';
          description.textContent = entry.text;
          article.append(date, title, description);
          root.append(article);
        });
      }

      function renderBlockers() {
        const root = $('blockers');
        if (data.blockers.length === 0) {
          const empty = document.createElement('p');
          empty.className = 'empty';
          empty.textContent = 'Нет активных блокеров.';
          root.append(empty);
          return;
        }
        data.blockers.forEach((blocker) => {
          const item = document.createElement('p');
          item.textContent = blocker;
          root.append(item);
        });
      }

      $('status-filter').addEventListener('change', renderPlan);
      $('unfinished-only').addEventListener('change', renderPlan);
      $('current-button').addEventListener('click', () => {
        $('status-filter').value = 'all';
        $('unfinished-only').checked = false;
        renderPlan();
        const current = document.querySelector(`#batch-${data.project.currentBatch}`);
        if (current) {
          current.open = true;
          current.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      });

      renderHeader();
      renderSummary();
      renderCurrent();
      renderNext();
      renderPlan();
      renderChanges();
      renderDecisions();
      renderBlockers();
    })();
  </script>
</body>
</html>
