# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/Module/*/Domain/Model/'

    Symfony\Component\PasswordHasher\Hasher\NativePasswordHasher: ~

    App\Module\Identity\Application\AdministratorPasswordHasher:
        alias: App\Module\Identity\Infrastructure\Security\SymfonyAdministratorPasswordHasher

    App\Module\Identity\Application\AdministratorProvisioningStore:
        alias: App\Module\Identity\Infrastructure\Persistence\DoctrineAdministratorProvisioningStore

    App\Module\Identity\Application\AdministratorAccountReader:
        alias: App\Module\Identity\Infrastructure\Persistence\DoctrineAdministratorAccountReader

    App\Module\Catalog\Application\ServiceStore:
        alias: App\Module\Catalog\Infrastructure\Persistence\DoctrineServiceStore

    App\Module\Clients\Application\ClientStore:
        alias: App\Module\Clients\Infrastructure\Persistence\DoctrineClientStore

    App\Module\Workforce\Application\WorkforceStore:
        alias: App\Module\Workforce\Infrastructure\Persistence\DoctrineWorkforceStore

    App\Module\Workforce\Application\WorkforceAvailabilityReader:
        alias: App\Module\Workforce\Infrastructure\Persistence\DoctrineWorkforceAvailabilityReader

    App\Module\Scheduling\Application\ScheduleAllocationStore:
        alias: App\Module\Scheduling\Infrastructure\Persistence\DoctrineScheduleAllocationStore

    App\Module\Scheduling\Application\AppointmentStore:
        alias: App\Module\Scheduling\Infrastructure\Persistence\DoctrineAppointmentStore

    App\Module\Scheduling\Application\CalendarQuery:
        alias: App\Module\Scheduling\Infrastructure\Persistence\DoctrineCalendarQuery

    App\Module\Scheduling\Application\RegularScheduleStore:
        alias: App\Module\Scheduling\Infrastructure\Persistence\DoctrineRegularScheduleStore

    App\Module\Organization\Application\OrganizationContext:
        alias: App\Module\Organization\Infrastructure\Context\SecurityOrganizationContext

    App\Module\Organization\Application\OrganizationExistenceChecker:
        alias: App\Module\Organization\Infrastructure\Persistence\DoctrineOrganizationExistenceChecker

    App\Module\Organization\Application\OrganizationDirectory:
        alias: App\Module\Organization\Infrastructure\Persistence\DoctrineOrganizationDirectory

    App\Module\Communications\Application\CommunicationStore:
        alias: App\Module\Communications\Infrastructure\Persistence\DoctrineCommunicationStore
